<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>s2h harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1 id="harness-name">harness</h1>
      <div id="harness-meta" class="meta"></div>
    </div>
    <button id="stop-button" class="ghost" disabled>Stop</button>
  </header>

  <main>
    <aside>
      <section>
        <h2>Skills</h2>
        <ul id="skills"></ul>
      </section>
      <section>
        <h2>Docs</h2>
        <ul id="docs"></ul>
      </section>
    </aside>

    <section id="chat">
      <div id="messages"></div>
      <form id="composer">
        <input id="message-input" type="text" autocomplete="off" placeholder="Ask the harness…" />
        <button id="send-button" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
