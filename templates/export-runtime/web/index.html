<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>s2h harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="/logo.png" alt="DeepClause" class="logo" />
      <div>
        <h1 id="harness-name">harness</h1>
        <div id="harness-meta" class="meta"></div>
      </div>
    </div>
    <button id="stop-button" class="ghost" disabled>Stop</button>
  </header>

  <main>
    <aside>
      <section>
        <h2>Skills</h2>
        <ul id="skills"></ul>
      </section>
      <section>
        <h2>Docs</h2>
        <ul id="docs"></ul>
      </section>
      <section>
        <h2>DML</h2>
        <ul id="dml-files"></ul>
      </section>
      <section>
        <h2>Diagrams</h2>
        <ul id="diagrams"></ul>
      </section>
    </aside>

    <section id="chat">
      <div id="messages"></div>
      <form id="composer">
        <input id="message-input" type="text" autocomplete="off" placeholder="Ask the harness…" />
        <button id="send-button" type="submit">Send</button>
      </form>
    </section>
  </main>

  <div id="viewer" class="viewer hidden">
    <div class="viewer-header">
      <span id="viewer-title">Viewer</span>
      <button id="viewer-close" class="ghost">Close</button>
    </div>
    <div id="viewer-body"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
